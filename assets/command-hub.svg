<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="100%" height="100%">
  <defs>
    <linearGradient id="hubBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="btnGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="hubGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .hub-title { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 13px; fill: #06B6D4; letter-spacing: 2px; }
    .hub-desc { font-family: 'JetBrains Mono', sans-serif; font-size: 14px; fill: #F8FAFC; font-weight: 600; }
    .key-cap { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 12px; fill: #A78BFA; }
  </style>

  <!-- Base Dock -->
  <rect width="1000" height="180" rx="16" fill="url(#hubBg)" stroke="#1F293D" stroke-width="1.8"/>

  <!-- Top Command Bar Prompt -->
  <g transform="translate(30, 25)">
    <rect width="940" height="42" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    
    <!-- Command Search Icon & Text -->
    <text x="20" y="27" font-family="'JetBrains Mono', monospace" font-size="14" fill="#64748B">⌘K</text>
    <text x="60" y="26" font-family="'JetBrains Mono', monospace" font-size="13" fill="#94A3B8">
      Type a command or select a transmission channel to connect...
    </text>
    
    <!-- Shortcut Badge -->
    <rect x="850" y="8" width="70" height="26" rx="6" fill="#1F2937" stroke="#4B5563" stroke-width="0.8"/>
    <text x="885" y="25" text-anchor="middle" class="key-cap">ENTER ↵</text>
  </g>

  <!-- Transmission Options Row -->
  <g transform="translate(30, 85)">
    <!-- Channel 1: LinkedIn -->
    <g transform="translate(0, 0)">
      <rect width="215" height="65" rx="10" fill="#0E1322" stroke="#1E293B" stroke-width="1.2"/>
      <circle cx="28" cy="32" r="14" fill="#0A66C2"/>
      <text x="28" y="37" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">in</text>
      <text x="55" y="27" class="hub-title" font-size="10" fill="#0A66C2">PROFESSIONAL</text>
      <text x="55" y="47" class="hub-desc" font-size="13">LinkedIn Network</text>
    </g>

    <!-- Channel 2: Gmail -->
    <g transform="translate(240, 0)">
      <rect width="215" height="65" rx="10" fill="#0E1322" stroke="#1E293B" stroke-width="1.2"/>
      <circle cx="28" cy="32" r="14" fill="#EA4335"/>
      <text x="28" y="37" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="13" fill="#FFFFFF">✉</text>
      <text x="55" y="27" class="hub-title" font-size="10" fill="#EA4335">DIRECT EMAIL</text>
      <text x="55" y="47" class="hub-desc" font-size="13">lavitratyagi@gmail</text>
    </g>

    <!-- Channel 3: Instagram -->
    <g transform="translate(480, 0)">
      <rect width="215" height="65" rx="10" fill="#0E1322" stroke="#1E293B" stroke-width="1.2"/>
      <circle cx="28" cy="32" r="14" fill="#E4405F"/>
      <text x="28" y="37" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">📸</text>
      <text x="55" y="27" class="hub-title" font-size="10" fill="#E4405F">SOCIAL STREAM</text>
      <text x="55" y="47" class="hub-desc" font-size="13">@lavitra_tyagi</text>
    </g>

    <!-- Channel 4: GitHub -->
    <g transform="translate(720, 0)">
      <rect width="220" height="65" rx="10" fill="#0E1322" stroke="#8B5CF6" stroke-width="1.2" filter="url(#hubGlow)"/>
      <circle cx="28" cy="32" r="14" fill="#181717" stroke="#8B5CF6" stroke-width="1"/>
      <text x="28" y="37" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">🐙</text>
      <text x="55" y="27" class="hub-title" font-size="10" fill="#8B5CF6">SOURCE REPOS</text>
      <text x="55" y="47" class="hub-desc" font-size="13">@lavitratyagi</text>
    </g>
  </g>
</svg>
