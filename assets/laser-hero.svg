<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Glowing Gradients -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="highGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Laser Path Drawing Keyframes */
    @keyframes drawPath {
      0% { stroke-dashoffset: 1200; opacity: 0.2; }
      50% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -1200; opacity: 0.2; }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.02); }
    }

    @keyframes laserScan {
      0% { transform: translateY(-50px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(320px); opacity: 0; }
    }

    @keyframes textGlow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.6)); }
      50% { filter: drop-shadow(0 0 25px rgba(6, 182, 212, 0.9)); }
    }

    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .circuit-line {
      stroke-dasharray: 400;
      animation: drawPath 8s linear infinite;
    }

    .circuit-fast {
      stroke-dasharray: 200;
      animation: drawPath 4s ease-in-out infinite alternate;
    }

    .laser-beam {
      animation: laserScan 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .radar-circle {
      transform-origin: 850px 160px;
      animation: radarSpin 12s linear infinite;
    }

    .pulse-node {
      animation: blink 2s ease-in-out infinite;
    }

    .hero-title {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-weight: 900;
      font-size: 52px;
      fill: #ffffff;
      letter-spacing: 6px;
      animation: textGlow 4s ease-in-out infinite;
    }

    .hud-text {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      fill: #06B6D4;
      letter-spacing: 2px;
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1000" height="320" rx="16" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Geometric Grid Matrix Pattern -->
  <g opacity="0.12" stroke="#6366F1" stroke-width="0.8">
    <line x1="0" y1="40" x2="1000" y2="40"/>
    <line x1="0" y1="80" x2="1000" y2="80"/>
    <line x1="0" y1="120" x2="1000" y2="120"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="0" y1="280" x2="1000" y2="280"/>
    
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <!-- Laser Scanline Sweeper -->
  <g class="laser-beam">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="url(#cyberGrad)" stroke-width="2" filter="url(#highGlow)"/>
  </g>

  <!-- Laser Vector Wireframe & Circuit Pathways -->
  <g filter="url(#neonGlow)">
    <!-- Circuit Stream 1 -->
    <path class="circuit-line" d="M 50 160 L 150 160 L 200 90 L 380 90 L 420 140" fill="none" stroke="#8B5CF6" stroke-width="2.5"/>
    <circle cx="50" cy="160" r="4" fill="#8B5CF6" class="pulse-node"/>
    <circle cx="420" cy="140" r="4" fill="#06B6D4" class="pulse-node"/>

    <!-- Circuit Stream 2 -->
    <path class="circuit-fast" d="M 50 220 L 180 220 L 240 270 L 450 270" fill="none" stroke="#06B6D4" stroke-width="2"/>
    <circle cx="50" cy="220" r="3" fill="#06B6D4" class="pulse-node"/>
    <circle cx="450" cy="270" r="3" fill="#EC4899" class="pulse-node"/>

    <!-- Circuit Stream 3 (Right) -->
    <path class="circuit-line" d="M 950 120 L 850 120 L 800 60 L 650 60" fill="none" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="950" cy="120" r="4" fill="#3B82F6" class="pulse-node"/>

    <!-- Circuit Stream 4 (Bottom Right) -->
    <path class="circuit-fast" d="M 950 200 L 820 200 L 760 260 L 620 260" fill="none" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="950" cy="200" r="3" fill="#8B5CF6" class="pulse-node"/>
  </g>

  <!-- High-Tech Radar HUD Display (Right Side) -->
  <g filter="url(#neonGlow)">
    <circle cx="850" cy="160" r="70" fill="none" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="850" cy="160" r="50" fill="none" stroke="#334155" stroke-width="1"/>
    <circle cx="850" cy="160" r="25" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Rotating Sweep Scanner -->
    <g class="radar-circle">
      <line x1="850" y1="160" x2="850" y2="90" stroke="url(#neonPink)" stroke-width="2" filter="url(#neonGlow)"/>
      <circle cx="850" cy="100" r="3" fill="#06B6D4"/>
    </g>

    <!-- Radar Crosshairs -->
    <line x1="770" y1="160" x2="930" y2="160" stroke="#06B6D4" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.5"/>
    <line x1="850" y1="80" x2="850" y2="240" stroke="#06B6D4" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.5"/>
  </g>

  <!-- Developer Wireframe Cube / Hologram (Left Side) -->
  <g transform="translate(90, 80)" filter="url(#neonGlow)">
    <!-- Isometric Wireframe Cube -->
    <polygon points="40,10 75,30 75,70 40,50" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="1.5" class="circuit-fast"/>
    <polygon points="40,10 5,30 5,70 40,50" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1.5" class="circuit-fast"/>
    <polygon points="40,10 75,30 40,50 5,30" fill="#3B82F6" fill-opacity="0.25" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="40" cy="50" r="4" fill="#ffffff" class="pulse-node" filter="url(#highGlow)"/>
    <!-- Wireframe Satellite Nodes -->
    <line x1="40" y1="10" x2="40" y2="-10" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="40" cy="-10" r="3" fill="#8B5CF6"/>
  </g>

  <!-- Center Branding & Telemetry -->
  <!-- HUD Top Metrics -->
  <text x="500" y="70" text-anchor="middle" class="hud-text">
    [ PROTOCOL://DEV.CORE.INITIALIZED ] · [ LOC: 28.6139° N, 77.2090° E ] · [ SYS_STATUS: ACTIVE ]
  </text>

  <!-- Main Hero Glow Text -->
  <text x="500" y="145" text-anchor="middle" class="hero-title">
    LAVITRA TYAGI
  </text>

  <!-- Subtitle Tagline Badge -->
  <g transform="translate(260, 175)">
    <rect width="480" height="34" rx="17" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.2" opacity="0.85"/>
    <text x="240" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#06B6D4" letter-spacing="3">
      CROSS-PLATFORM ARCHITECT · SYSTEMS &amp; BACKEND
    </text>
  </g>

  <!-- HUD Corner Brackets -->
  <g stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.8">
    <!-- Top Left -->
    <path d="M 20 40 L 20 20 L 40 20"/>
    <!-- Top Right -->
    <path d="M 980 40 L 980 20 L 960 20"/>
    <!-- Bottom Left -->
    <path d="M 20 280 L 20 300 L 40 300"/>
    <!-- Bottom Right -->
    <path d="M 980 280 L 980 300 L 960 300"/>
  </g>

  <!-- Bottom Telemetry Ticker -->
  <text x="60" y="295" class="hud-text" fill="#64748B">
    STACK: [ FLUTTER · DART · PYTHON · FASTAPI · NODE.JS · C++ ]
  </text>
  <text x="940" y="295" text-anchor="end" class="hud-text" fill="#10B981">
    ● 100% OPERATIONAL
  </text>

</svg>
