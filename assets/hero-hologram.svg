<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%">
  <defs>
    <!-- Glowing Color Gradients -->
    <linearGradient id="cyberViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="neonPinkCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="darkSlateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="intenseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes laserScanVertical {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(360px); opacity: 0; }
    }

    @keyframes lineDrawAnimation {
      0% { stroke-dashoffset: 1000; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1000; }
    }

    @keyframes pulseNodeGlow {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes textBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .laser-scan { animation: laserScanVertical 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .wireframe-draw { stroke-dasharray: 500; animation: lineDrawAnimation 8s ease-in-out infinite; }
    .node-pulse { transform-box: fill-box; transform-origin: center; animation: pulseNodeGlow 2.5s ease-in-out infinite; }
    .radar-sweep { transform-origin: 180px 220px; animation: radarSpin 10s linear infinite; }
    .live-dot { animation: textBlink 1.5s infinite; }

    .mono-title { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 900; }
    .mono-sub { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 600; }
  </style>

  <!-- Background Base Container with Cyber Border -->
  <rect width="1000" height="440" rx="20" fill="url(#darkSlateBg)" stroke="#1F293D" stroke-width="1.8"/>

  <!-- Matrix Background Grid -->
  <g opacity="0.08" stroke="#06B6D4" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="440"/>
    <line x1="120" y1="0" x2="120" y2="440"/>
    <line x1="200" y1="0" x2="200" y2="440"/>
    <line x1="280" y1="0" x2="280" y2="440"/>
    <line x1="360" y1="0" x2="360" y2="440"/>
    <line x1="440" y1="0" x2="440" y2="440"/>
    <line x1="520" y1="0" x2="520" y2="440"/>
    <line x1="600" y1="0" x2="600" y2="440"/>
    <line x1="680" y1="0" x2="680" y2="440"/>
    <line x1="760" y1="0" x2="760" y2="440"/>
    <line x1="840" y1="0" x2="840" y2="440"/>
    <line x1="920" y1="0" x2="920" y2="440"/>
    
    <line x1="0" y1="60" x2="1000" y2="60"/>
    <line x1="0" y1="120" x2="1000" y2="120"/>
    <line x1="0" y1="180" x2="1000" y2="180"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="0" y1="300" x2="1000" y2="300"/>
    <line x1="0" y1="360" x2="1000" y2="360"/>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT COLUMN: LINE-ART HOLOGRAPHIC DEVELOPER PORTRAIT & WIREFRAME MATRIX   -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 40)">
    <!-- Frame Box -->
    <rect width="280" height="360" rx="14" fill="#0E1322" stroke="#1E293B" stroke-width="1.5"/>
    <rect width="280" height="360" rx="14" fill="none" stroke="url(#cyberViolet)" stroke-width="1" opacity="0.4"/>

    <!-- Scanning Laser -->
    <g class="laser-scan">
      <line x1="5" y1="0" x2="275" y2="0" stroke="url(#neonPinkCyan)" stroke-width="2.5" filter="url(#intenseGlow)"/>
    </g>

    <!-- Radar Rings -->
    <circle cx="140" cy="180" r="110" fill="none" stroke="#1E293B" stroke-width="1"/>
    <circle cx="140" cy="180" r="75" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="4,4"/>
    <circle cx="140" cy="180" r="40" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>

    <!-- Radar Sweep Line -->
    <g class="radar-sweep" transform-origin="140px 180px">
      <line x1="140" y1="180" x2="140" y2="70" stroke="url(#neonPinkCyan)" stroke-width="2" filter="url(#softGlow)"/>
    </g>

    <!-- ======================================================================= -->
    <!-- INTRICATE LINE-ART & OBJECTS: VECTOR DEVELOPER PORTRAIT SILHOUETTE      -->
    <!-- ======================================================================= -->
    <g filter="url(#intenseGlow)">
      <!-- Head Contour & Neural Vector Wireframes -->
      <polygon points="140,90 175,105 190,140 185,190 160,230 140,245 120,230 95,190 90,140 105,105" 
               fill="none" stroke="#8B5CF6" stroke-width="2" class="wireframe-draw"/>
      
      <!-- Inner Neural Face Geometry -->
      <line x1="140" y1="90" x2="140" y2="245" stroke="#06B6D4" stroke-width="1.2" stroke-dasharray="2,2"/>
      <line x1="105" y1="105" x2="175" y2="105" stroke="#06B6D4" stroke-width="1"/>
      <line x1="90" y1="140" x2="190" y2="140" stroke="#8B5CF6" stroke-width="1.2"/>
      <line x1="95" y1="190" x2="185" y2="190" stroke="#06B6D4" stroke-width="1.2"/>
      <line x1="120" y1="230" x2="160" y2="230" stroke="#8B5CF6" stroke-width="1"/>

      <!-- Facial Triangulation Lines -->
      <line x1="140" y1="90" x2="140" y2="140" stroke="#EC4899" stroke-width="1.5"/>
      <line x1="105" y1="105" x2="140" y2="140" stroke="#06B6D4" stroke-width="1"/>
      <line x1="175" y1="105" x2="140" y2="140" stroke="#06B6D4" stroke-width="1"/>
      <line x1="140" y1="140" x2="120" y2="180" stroke="#8B5CF6" stroke-width="1"/>
      <line x1="140" y1="140" x2="160" y2="180" stroke="#8B5CF6" stroke-width="1"/>
      <line x1="120" y1="180" x2="160" y2="180" stroke="#06B6D4" stroke-width="1.2"/>
      <line x1="120" y1="180" x2="140" y2="215" stroke="#8B5CF6" stroke-width="1"/>
      <line x1="160" y1="180" x2="140" y2="215" stroke="#8B5CF6" stroke-width="1"/>
      <line x1="140" y1="215" x2="140" y2="245" stroke="#06B6D4" stroke-width="1.5"/>

      <!-- Cybernetic Glasses / HUD Visor Frame -->
      <polygon points="110,132 135,132 138,145 113,145" fill="#06B6D4" fill-opacity="0.3" stroke="#06B6D4" stroke-width="1.5"/>
      <polygon points="145,132 170,132 167,145 142,145" fill="#06B6D4" fill-opacity="0.3" stroke="#06B6D4" stroke-width="1.5"/>
      <line x1="135" y1="138" x2="145" y2="138" stroke="#06B6D4" stroke-width="2"/>

      <!-- Glowing Node Coordinates -->
      <circle cx="140" cy="90" r="3.5" fill="#EC4899" class="node-pulse"/>
      <circle cx="105" cy="105" r="3" fill="#8B5CF6" class="node-pulse"/>
      <circle cx="175" cy="105" r="3" fill="#8B5CF6" class="node-pulse"/>
      <circle cx="140" cy="140" r="4" fill="#06B6D4" class="node-pulse"/>
      <circle cx="120" cy="180" r="3" fill="#8B5CF6" class="node-pulse"/>
      <circle cx="160" cy="180" r="3" fill="#8B5CF6" class="node-pulse"/>
      <circle cx="140" cy="245" r="3.5" fill="#EC4899" class="node-pulse"/>

      <!-- Shoulder / Torso Vector Architecture -->
      <path d="M 60 300 L 95 255 L 140 270 L 185 255 L 220 300" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="95" y1="255" x2="140" y2="245" stroke="#06B6D4" stroke-width="1"/>
      <line x1="185" y1="255" x2="140" y2="245" stroke="#06B6D4" stroke-width="1"/>
    </g>

    <!-- Overlay HUD Crosshairs & Corner Targets -->
    <path d="M 15 30 L 15 15 L 30 15" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
    <path d="M 265 30 L 265 15 L 250 15" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
    <path d="M 15 330 L 15 345 L 30 345" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
    <path d="M 265 330 L 265 345 L 250 345" fill="none" stroke="#06B6D4" stroke-width="1.5"/>

    <!-- Bottom ID Badge -->
    <rect x="30" y="315" width="220" height="26" rx="6" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1"/>
    <text x="140" y="332" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#06B6D4" letter-spacing="1.5">
      [ VECTOR_ID: LAVITRA.DEV ]
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT COLUMN: HIGH-TECH HUD DOSSIER & SYSTEM ARCHITECTURE                 -->
  <!-- ========================================================================= -->
  <g transform="translate(360, 45)">
    <!-- Top Telemetry Protocol -->
    <text x="0" y="20" class="mono-sub" font-size="11.5" fill="#64748B" letter-spacing="2">
      // SYSTEM_DIRECTIVE : QUANTUM_DEVELOPER_DOSSIER_V3.8
    </text>

    <!-- Main Title -->
    <text x="0" y="75" class="mono-title" font-size="46" fill="#FFFFFF" letter-spacing="4" filter="url(#softGlow)">
      LAVITRA TYAGI
    </text>

    <!-- Role Badge Box -->
    <g transform="translate(0, 95)">
      <rect width="460" height="32" rx="6" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.2"/>
      <text x="15" y="21" class="mono-sub" font-size="12" fill="#06B6D4" letter-spacing="1.5">
        ⚡ CROSS-PLATFORM ARCHITECT · SYSTEMS &amp; BACKEND
      </text>
    </g>

    <!-- Specification Grid Cards -->
    <!-- Card 1: Core Engine -->
    <g transform="translate(0, 145)">
      <rect width="280" height="70" rx="10" fill="#0E1322" stroke="#1E293B" stroke-width="1.2"/>
      <text x="15" y="25" class="mono-sub" font-size="10.5" fill="#8B5CF6" letter-spacing="1">
        ■ PRIMARY ENGINE
      </text>
      <text x="15" y="48" class="mono-title" font-size="15" fill="#F8FAFC">
        Flutter • Dart • FastAPI
      </text>
      <circle cx="260" cy="25" r="4" fill="#10B981" class="live-dot"/>
    </g>

    <!-- Card 2: Microservices & Data -->
    <g transform="translate(300, 145)">
      <rect width="280" height="70" rx="10" fill="#0E1322" stroke="#1E293B" stroke-width="1.2"/>
      <text x="15" y="25" class="mono-sub" font-size="10.5" fill="#06B6D4" letter-spacing="1">
        ■ DATA &amp; INFRA
      </text>
      <text x="15" y="48" class="mono-title" font-size="15" fill="#F8FAFC">
        Node.js • PostgreSQL • Redis
      </text>
      <circle cx="260" cy="25" r="4" fill="#06B6D4" class="live-dot"/>
    </g>

    <!-- Card 3: Location Coordinates -->
    <g transform="translate(0, 230)">
      <rect width="280" height="70" rx="10" fill="#0E1322" stroke="#1E293B" stroke-width="1.2"/>
      <text x="15" y="25" class="mono-sub" font-size="10.5" fill="#EC4899" letter-spacing="1">
        ■ BASE COORDINATES
      </text>
      <text x="15" y="48" class="mono-title" font-size="14" fill="#F8FAFC">
        India 🇮🇳 [28.61° N, 77.20° E]
      </text>
    </g>

    <!-- Card 4: System Status -->
    <g transform="translate(300, 230)">
      <rect width="280" height="70" rx="10" fill="#0E1322" stroke="#1E293B" stroke-width="1.2"/>
      <text x="15" y="25" class="mono-sub" font-size="10.5" fill="#10B981" letter-spacing="1">
        ■ TELEMETRY STATUS
      </text>
      <text x="15" y="48" class="mono-title" font-size="14" fill="#10B981">
        ● OPERATIONAL (OPEN TO WORK)
      </text>
    </g>

    <!-- Bottom Cyber Terminal Bar -->
    <g transform="translate(0, 320)">
      <rect width="580" height="34" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <text x="15" y="22" class="mono-sub" font-size="11" fill="#94A3B8">
        $ lavitra --exec <tspan fill="#06B6D4">"craft_clean_code --zero-fluff --high-impact"</tspan>
      </text>
      <text x="560" y="22" text-anchor="end" class="mono-sub" font-size="11" fill="#8B5CF6">
        [OK 200]
      </text>
    </g>
  </g>

  <!-- Outer Frame HUD Accents -->
  <g stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 15 35 L 15 15 L 35 15"/>
    <path d="M 985 35 L 985 15 L 965 15"/>
    <path d="M 15 405 L 15 425 L 35 425"/>
    <path d="M 985 405 L 985 425 L 965 425"/>
  </g>
</svg>
