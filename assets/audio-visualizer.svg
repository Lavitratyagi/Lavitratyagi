<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 130" width="100%" height="100%">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes barBounce1 { 0%, 100% { height: 10px; y: 80px; } 50% { height: 50px; y: 40px; } }
    @keyframes barBounce2 { 0%, 100% { height: 35px; y: 55px; } 50% { height: 15px; y: 75px; } }
    @keyframes barBounce3 { 0%, 100% { height: 20px; y: 70px; } 50% { height: 60px; y: 30px; } }
    @keyframes barBounce4 { 0%, 100% { height: 45px; y: 45px; } 50% { height: 25px; y: 65px; } }
    @keyframes barBounce5 { 0%, 100% { height: 15px; y: 75px; } 50% { height: 55px; y: 35px; } }
    @keyframes pulseDisk { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }

    .bar1 { animation: barBounce1 1.2s ease-in-out infinite; }
    .bar2 { animation: barBounce2 0.9s ease-in-out infinite 0.2s; }
    .bar3 { animation: barBounce3 1.4s ease-in-out infinite 0.1s; }
    .bar4 { animation: barBounce4 1.1s ease-in-out infinite 0.3s; }
    .bar5 { animation: barBounce5 0.8s ease-in-out infinite 0.4s; }
    .disk-pulse { transform-origin: 50px 65px; animation: pulseDisk 2s ease-in-out infinite; }
  </style>

  <!-- Container Box -->
  <rect width="700" height="130" rx="14" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left: Vinyl Record / Audio Icon with Glow -->
  <g class="disk-pulse" filter="url(#glow)">
    <circle cx="60" cy="65" r="32" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="60" cy="65" r="22" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle cx="60" cy="65" r="12" fill="none" stroke="#06B6D4" stroke-width="1"/>
    <circle cx="60" cy="65" r="5" fill="#EC4899"/>
  </g>

  <!-- Track & Vibe Details -->
  <text x="115" y="48" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#06B6D4" letter-spacing="1.5">
    CURRENT VIBE // AUDIO MATRIX
  </text>
  <text x="115" y="74" font-family="'JetBrains Mono', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
    Deep Focus · Cyber Lofi &amp; Synthwave Beats 🎧
  </text>
  <text x="115" y="96" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">
    STATUS: [ 24/7 FLOW STATE · CODING IN THE ZONE ]
  </text>

  <!-- Right: Dynamic Spectrum Waveform Bars -->
  <g filter="url(#glow)">
    <!-- Equalizer Frequency Bars -->
    <rect class="bar1" x="520" y="80" width="5" height="10" rx="2.5" fill="url(#barGrad)"/>
    <rect class="bar2" x="530" y="55" width="5" height="35" rx="2.5" fill="url(#barGrad)"/>
    <rect class="bar3" x="540" y="70" width="5" height="20" rx="2.5" fill="url(#barGrad)"/>
    <rect class="bar4" x="550" y="45" width="5" height="45" rx="2.5" fill="url(#barGrad)"/>
    <rect class="bar5" x="560" y="75" width="5" height="15" rx="2.5" fill="url(#barGrad)"/>
    <rect class="bar2" x="570" y="55" width="5" height="35" rx="2.5" fill="url(#barGrad)"/>
    <rect class="bar1" x="580" y="80" width="5" height="10" rx="2.5" fill="url(#barGrad)"/>
    <rect class="bar4" x="590" y="45" width="5" height="45" rx="2.5" fill="url(#barGrad)"/>
    <rect class="bar3" x="600" y="70" width="5" height="20" rx="2.5" fill="url(#barGrad)"/>
    <rect class="bar5" x="610" y="75" width="5" height="15" rx="2.5" fill="url(#barGrad)"/>
    <rect class="bar2" x="620" y="55" width="5" height="35" rx="2.5" fill="url(#barGrad)"/>
    <rect class="bar4" x="630" y="45" width="5" height="45" rx="2.5" fill="url(#barGrad)"/>
    <rect class="bar1" x="640" y="80" width="5" height="10" rx="2.5" fill="url(#barGrad)"/>
    <rect class="bar3" x="650" y="70" width="5" height="20" rx="2.5" fill="url(#barGrad)"/>
    <rect class="bar5" x="660" y="75" width="5" height="15" rx="2.5" fill="url(#barGrad)"/>
  </g>
</svg>
